
<div class="mt-5">

  <div class="flex flex-wrap justify-between items-center gap-3 mb-4">

    <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
      Tâches
    </h3>

    <button
      type="button"
      (click)="onAddTask()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition"
    >
      + Ajouter une tâche
    </button>

  </div>

  <!-- Formulaire d'ajout ou de modification -->
  @if (showTaskForm()) {

    <div class="mb-6">

      <app-task-form
        [task]="selectedTask()"
        (taskSubmit)="onTaskSubmit($event)"
      />

      <button
        type="button"
        (click)="onCancelForm()"
        class="mt-3 px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg"
      >
        Annuler
      </button>

    </div>

  }

  <!-- Filtres -->
  <div class="flex flex-wrap gap-2 mb-4">

    <button
      type="button"
      (click)="statusFilter.set('Toutes')"
      [class.bg-blue-600]="statusFilter() === 'Toutes'"
      [class.text-white]="statusFilter() === 'Toutes'"
      class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 dark:text-gray-200"
    >
      Toutes
    </button>

    <button
      type="button"
      (click)="statusFilter.set('En cours')"
      [class.bg-blue-600]="statusFilter() === 'En cours'"
      [class.text-white]="statusFilter() === 'En cours'"
      class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 dark:text-gray-200"
    >
      En cours
    </button>

    <button
      type="button"
      (click)="statusFilter.set('Terminées')"
      [class.bg-blue-600]="statusFilter() === 'Terminées'"
      [class.text-white]="statusFilter() === 'Terminées'"
      class="px-3 py-2 rounded border border-gray-300 dark:border-gray-600 dark:text-gray-200"
    >
      Terminées
    </button>

  </div>

  <!-- Liste des tâches -->
  <div class="space-y-3">

    @for (task of filteredTasks(); track task.id) {

      <div class="flex flex-col sm:flex-row gap-2">

        <div class="flex-1 min-w-0">

          <app-task-item
            [task]="task"
            [showAssignee]="showAssignee()"
            [users]="users()"
            (taskStatusChange)="onTaskStatusChange(task.id, $event)"
            (deleteTask)="onDeleteTask(task.id)"
          />

        </div>

        <button
          type="button"
          (click)="onEditTask(task)"
          class="px-3 py-2 rounded-lg bg-yellow-500 hover:bg-yellow-600 text-white self-start"
        >
          Modifier
        </button>

      </div>

    } @empty {

      <p class="text-gray-500 dark:text-gray-300 italic">
        Aucune tâche pour ce filtre
      </p>

    }

  </div>

</div>
