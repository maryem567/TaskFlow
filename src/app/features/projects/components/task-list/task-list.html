
<div class="mt-5">
  <h3 class="text-lg font-semibold mb-3">
    Tâches
  </h3>

  <div class="space-y-3">
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [users]="users()"
        (taskStatusChange)="onTaskStatusChange(task.id, $event)"
/>
    } @empty {
      <p class="text-gray-500 italic">
        Aucune tâche
      </p>
    }
  </div>
</div>
